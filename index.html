<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1728">
  <meta name="description" content="YKS Defterim bağımsız koç paneli">
  <title>YKS Defterim · Koç Paneli</title>
  <link rel="stylesheet" href="./base-reset.css?v=1.0.0">
  <link rel="stylesheet" href="./sidebar-v20.css?v=1.0.0">
</head>
<body>
  <section id="authView" class="auth-page">
    <main class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">YK</div>
        <div><div class="kicker">YKS Defterim</div><h1>Koç Paneli</h1></div>
      </div>
      <p>Koç paneline devam etmek için hesabınla giriş yap.</p>
      <div class="status" id="authStatus">Koç hesabınla giriş yap.</div>
      <div class="auth-actions">
        <button class="btn primary" id="signInBtn" type="button">Google ile giriş yap</button>
        <a class="btn" href="./register.html">Yeni koç hesabı oluştur</a>
      </div>
    </main>
  </section>

  <div id="appView" class="shell coach-shell-reset hidden">
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar coach-sidebar-v20" id="sidebar">
      <div class="brand coach-brand-v20">
        <div class="brand-mark">YK</div>
        <div class="brand-copy"><b>YKS Defterim</b><span>Koç Paneli</span></div>
      </div>

      <nav class="coach-nav-v20" id="coachNav" aria-label="Koç paneli">
        <button class="coach-nav-item on" type="button" data-coach-page="home"><span>⌂</span><b>Ana Sayfa</b></button>
        <button class="coach-nav-item" type="button" data-coach-page="students"><span>♟</span><b>Öğrenciler</b></button>
        <button class="coach-nav-item" type="button" data-coach-page="programs"><span>▣</span><b>Programlar</b></button>
        <button class="coach-nav-item" type="button" data-coach-page="reports"><span>▥</span><b>Takip &amp; Rapor</b></button>
        <button class="coach-nav-item" type="button" data-coach-page="exams"><span>▤</span><b>Deneme Analizi</b></button>
        <button class="coach-nav-item" type="button" data-coach-page="topics"><span>◫</span><b>Konular</b></button>
        <button class="coach-nav-item" type="button" data-coach-page="errors"><span>✎</span><b>Hata Defteri</b></button>
        <button class="coach-nav-item" type="button" data-coach-page="messages"><span>✉</span><b>Mesajlar</b></button>
        <button class="coach-nav-item" type="button" data-coach-page="settings"><span>⚙</span><b>Ayarlar</b></button>
      </nav>

      <div class="coach-sidebar-spacer"></div>

      <section class="coach-profile-v20">
        <div class="coach-profile-avatar" id="coachSidebarAvatar">K</div>
        <div><span>Koç</span><b id="coachSidebarName">Koç</b></div>
      </section>

      <div class="sidebar-footer">
        <button class="coach-signout-v20" id="signOutBtn" type="button">↪ <span>Çıkış Yap</span></button>
      </div>
    </aside>

    <main class="coach-reset-canvas" aria-label="Yeni koç paneli çalışma alanı">
      <button class="coach-mobile-menu-reset mobile-only" id="menuBtn" type="button" aria-label="Menüyü aç">☰</button>
    </main>
  </div>

  <script type="module" src="./app-reset.js?v=1.0.0"></script>
</body>
</html>
