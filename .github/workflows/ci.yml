name: Koç paneli kalite denetimi

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Test bağımlılıklarını kur
        run: npm ci --ignore-scripts
      - name: Regresyon testlerini çalıştır
        run: npm test
