# Haftalık bağımlılık taraması: her ekosistem için tek toplu PR; CI testleri PR'da çalışır.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly, day: monday, timezone: Europe/Istanbul}
    open-pull-requests-limit: 3
    groups:
      npm: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday, timezone: Europe/Istanbul}
    groups:
      actions: {patterns: ["*"]}
